name: DeenWallet Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Decode Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64"

          echo "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/deenwallet-release.keystore"

          test -s "$RUNNER_TEMP/deenwallet-release.keystore"

      - name: Read Android version
        id: version
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          VERSION_CODE=$(grep -E 'versionCode[[:space:]]+[0-9]+' app/build.gradle \
            | head -1 \
            | awk '{print $2}')

          VERSION_NAME=$(grep -E 'versionName[[:space:]]+"[^"]+"' app/build.gradle \
            | head -1 \
            | sed -E 's/.*versionName[[:space:]]+"([^"]+)".*/\1/')

          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

          echo "Building DeenWallet $VERSION_NAME ($VERSION_CODE)"

      - name: Build signed AAB and APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/deenwallet-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ./gradlew clean bundleRelease assembleRelease --no-daemon

      - name: Verify release artifacts
        working-directory: android
        run: |
          set -euo pipefail

          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/apk/release/app-release.apk

          echo "AAB:"
          ls -lh app/build/outputs/bundle/release/app-release.aab

          echo "APK:"
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Check Google Play credentials
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail

          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Google Play credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Google Play credentials are not configured."
          fi

      - name: Upload AAB to Google Play Internal Testing
        if: steps.play.outputs.configured == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.deenwallet.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Skip Google Play upload
        if: steps.play.outputs.configured != 'true'
        run: |
          echo "Google Play upload is being skipped."
          echo "PLAY_SERVICE_ACCOUNT_JSON is not configured."
          echo "The AAB will still be built."
          echo "The APK will still be deployed to Oracle."

      - name: Prepare stable APK for Oracle
        run: |
          set -euo pipefail

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            "DeenWallet.apk"

          test -s "DeenWallet.apk"

          echo "Prepared stable APK:"
          ls -lh "DeenWallet.apk"

      - name: Upload stable APK to Oracle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "DeenWallet.apk"
          target: "/var/www/deenwallet/downloads/"

      - name: Verify and update Android production metadata
        uses: appleboy/ssh-action@v1.0.3
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: VERSION_CODE,VERSION_NAME
          script: |
            set -euo pipefail

            APP_DIR="/var/www/deenwallet"
            APK_DIR="$APP_DIR/downloads"
            METADATA_FILE="$APP_DIR/android-update.json"
            APK_NAME="DeenWallet.apk"

            APK_PATH="$APK_DIR/$APK_NAME"

            echo "Checking uploaded APK..."
            test -f "$APK_PATH"
            test -s "$APK_PATH"

            echo "Uploaded APK:"
            ls -lh "$APK_PATH"

            echo "Updating Android metadata..."

            VERSION_CODE="$VERSION_CODE" \
            VERSION_NAME="$VERSION_NAME" \
            APK_NAME="$APK_NAME" \
            python3 - <<'PYJSON'
            import json
            import os
            from pathlib import Path

            metadata = {
                "versionCode": int(os.environ["VERSION_CODE"]),
                "versionName": os.environ["VERSION_NAME"],
                "downloadUrl": f"https://deenwallapp.com/downloads/{os.environ['APK_NAME']}",
                "forceUpdate": False,
                "releaseNotes": [
                    "Improved update system",
                    "Bug fixes"
                ]
            }

            target = Path("/var/www/deenwallet/android-update.json")
            temporary = target.with_suffix(".json.tmp")

            temporary.write_text(
                json.dumps(metadata, separators=(",", ":")) + "\n",
                encoding="utf-8"
            )

            temporary.replace(target)
            PYJSON

            test -s "$METADATA_FILE"

            echo "Current Android update metadata:"
            cat "$METADATA_FILE"

            echo
            echo "Android release:"
            echo "Version: $VERSION_NAME"
            echo "Version code: $VERSION_CODE"
            echo "APK: https://deenwallapp.com/downloads/$APK_NAME"
            echo "Backend service was NOT restarted."

      - name: Verify stable APK over HTTPS
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail

          echo "Checking public APK URL..."

          curl \
            --fail \
            --silent \
            --show-error \
            --head \
            "https://deenwallapp.com/downloads/DeenWallet.apk"

          echo
          echo "Public APK is reachable."

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            DeenWallet.apk
            android/app/build/outputs/bundle/release/app-release.aab